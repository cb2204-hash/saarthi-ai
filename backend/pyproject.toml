[project]
name = "saarthi-backend"
version = "0.1.0"
description = "Cloud-Agnostic AI Inference Platform"
requires-python = ">=3.12"

dependencies = [
    "alembic>=1.18.5",
    "email-validator>=2.3.0",
    "fastapi>=0.140.0",
    "loguru>=0.7.3",
    "passlib[bcrypt]>=1.7.4",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
    "black>=26.5.1",
    "isort>=8.0.1",
]
